name: github pages

on:
  push:
    branches:
      - main  # Set a branch to deploy
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ contains(github.event.head_commit.message, 'build') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # we need fetch all to get modified (committed) date

#      - name: Setup Python
#        uses: actions/setup-python@v4
#        with:
#          python-version: '3.9'

      # Hugo re-encodes every image (resize + webp) on each build, which is
      # ~95% of the build time. Its output is content-hash keyed and cached in
      # resources/_gen, so restoring that cache means only new or changed
      # images get processed.
      - name: Cache Hugo resources
        uses: actions/cache@v4
        with:
          path: |
            resources/_gen
            /tmp/hugo_cache
          key: hugo-resources-${{ github.run_id }}
          restore-keys: |
            hugo-resources-

      - name: Build site
        run: bash scripts/build.sh

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build
        run: hugo --minify --cacheDir /tmp/hugo_cache

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          publish_dir: ./public
